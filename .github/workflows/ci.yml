name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint workspaces
        run: npm run lint

      - name: Test workspaces
        run: npm run test

      - name: Build workspaces
        run: npm run build

      - name: Validate static welcome page files
        run: |
          test -f apps/static-page/index.html
          test -f apps/static-page/styles.css
