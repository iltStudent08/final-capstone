services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/final-capstone
      JWT_SECRET: dev-secret-change-in-production
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      - mongo
    ports:
      - '4000:4000'

  client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '3000:80'

volumes:
  mongo-data:
