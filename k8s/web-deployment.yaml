apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-capstone-web
  namespace: final-capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-capstone-web
  template:
    metadata:
      labels:
        app: final-capstone-web
    spec:
      containers:
        - name: web
          image: REPLACE_WITH_WEB_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: final-capstone-web
  namespace: final-capstone
spec:
  selector:
    app: final-capstone-web
  ports:
    - port: 80
      targetPort: 80
